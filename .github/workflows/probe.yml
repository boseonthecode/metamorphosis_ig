name: moltbook-probe

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run probe battery
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          LLM_PROVIDER: groq
          LLM_MODEL: openai/gpt-oss-120b
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python moltbook_experiment.py probe

      - name: Commit and push data
        run: |
          git config user.name "moltbook-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "probe log $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push