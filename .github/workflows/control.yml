name: moltbook-control

on:
  schedule:
    - cron: "30 */6 * * *"   # offset by 30 min from the live agent so they don't compete for runner minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moltbook-control
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Configure git identity for in-script commits
        run: |
          git config user.name "moltbook-control-bot"
          git config user.email "actions@github.com"

      - name: Run control probe loop for this chunk
        env:
          LLM_PROVIDER: groq
          LLM_MODEL: openai/gpt-oss-120b
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python control_experiment.py loop --hours 5.75 --probe-every 60